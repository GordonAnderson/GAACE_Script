; =============================================================================
; PlatformIO project configuration — GAACE_Script library root
; =============================================================================
; Open the GAACE_Script/ folder in VS Code and build from here.
;
;   pio test -e native        run the unit tests (no hardware required —
;                              the VM core has no board-specific dependencies)
;   pio run -e teensy41 -t upload         build/upload the BasicScript example
;   pio run -e adafruit_feather_m0 -t upload   (SAMD21 target)
;
; Source for the example environments is pulled from
; examples/BasicScript/src. Library headers are resolved from src/.
; =============================================================================

[platformio]
default_envs = native
src_dir = examples/BasicScript/src

[env]
; lib/GAACE_Script_core is a filesystem symlink to ../src (see lib/ folder) —
; PlatformIO's Library Dependency Finder auto-scans lib/* for every
; environment (native included), which is more reliable here than a
; self-referential `lib_deps = symlink://.` (that approach doesn't expose
; its own headers/sources to the native test build).
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Native — runs the VM core's unit tests on this machine, no hardware.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_filter = test_vm, test_hex

; ---------------------------------------------------------------------------
; Teensy 4.1 — the board this VM was originally designed for (USBrepeater).
; ---------------------------------------------------------------------------
[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino
lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git

; ---------------------------------------------------------------------------
; Adafruit Feather M0 (SAMD21) — proves the core is portable to SAM-based
; GAACE projects, not just Teensy.
; ---------------------------------------------------------------------------
[env:adafruit_feather_m0]
platform  = atmelsam
board     = adafruit_feather_m0
framework = arduino
lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git

; ---------------------------------------------------------------------------
; Adafruit QT Py M0 (SAMD21) -- on-device capstone test (test/test_runtime)
; proving cmd() reaches a real commandProcessor via executeLine(), not a
; fake bridge. Run with:
;   pio test -e adafruit_qt_py_m0 --upload-port <port>
; ---------------------------------------------------------------------------
[env:adafruit_qt_py_m0]
platform  = atmelsam
board     = adafruit_qt_py_m0
framework = arduino
lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    throwtheswitch/Unity@^2.6.1
test_filter = test_runtime
