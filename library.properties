sentence=Minimal stack-based bytecode VM for host-downloadable control scripts on GAACE firmware.
paragraph=No heap, no garbage collector, no board-specific code in the core. Embedding projects register their own syscall table (e.g. per-device commands, ADC reads) so the same VM core runs unmodified across GAACE hardware families.
